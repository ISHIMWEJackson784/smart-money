<!DOCTYPE html>
<html>
<head>
  <title>Smart Money Tracker</title>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #0f172a;
      color: white;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 5px;
      border: none;
    }

    button {
      background: #22c55e;
      color: white;
      font-weight: bold;
    }

    .expense {
      color: #f87171;
    }

    .income {
      color: #4ade80;
    }

    ul {
      padding-left: 15px;
    }
  </style>
</head>

<body>

<h1>💰 Smart Money</h1>

<div class="card">
  <h2>Balance: <span id="balance">0</span> RWF</h2>
  <p id="message">Start tracking your money</p>

  <p>📅 Today spent: <span id="today">0</span> RWF</p>
  <p>📊 This week: <span id="week">0</span> RWF</p>
</div>

<div class="card">
  <h3>Add Transaction</h3>
  
  <input type="number" id="amount" placeholder="Enter amount" />

  <select id="type">
    <option value="income">Income</option>
    <option value="expense">Expense</option>
  </select>

  <select id="category">
    <option>Food</option>
    <option>Transport</option>
    <option>Airtime</option>
    <option>Other</option>
  </select>

  <button onclick="addTransaction()">Add</button>
</div>

<div class="card">
  <h3>History</h3>
  <ul id="history"></ul>
</div>

<script>
let transactions = JSON.parse(localStorage.getItem("transactions")) || [];

function saveData() {
  localStorage.setItem("transactions", JSON.stringify(transactions));
}

function isToday(date) {
  let today = new Date();
  let d = new Date(date);
  return d.toDateString() === today.toDateString();
}

function isThisWeek(date) {
  let now = new Date();
  let d = new Date(date);

  let firstDay = new Date(now);
  firstDay.setDate(now.getDate() - now.getDay());

  let lastDay = new Date(firstDay);
  lastDay.setDate(firstDay.getDate() + 6);

  return d >= firstDay && d <= lastDay;
}

function updateUI() {
  let balance = 0;
  let income = 0;
  let expense = 0;

  let todayExpense = 0;
  let weekExpense = 0;

  let historyList = document.getElementById("history");
  historyList.innerHTML = "";

  transactions.forEach(t => {
    let li = document.createElement("li");

    let date = new Date(t.date).toLocaleDateString();

    li.textContent = `${t.type}: ${t.amount} (${t.category}) - ${date}`;
    li.className = t.type;

    historyList.appendChild(li);

    if (t.type === "income") {
      balance += t.amount;
      income += t.amount;
    } else {
      balance -= t.amount;
      expense += t.amount;

      if (isToday(t.date)) {
        todayExpense += t.amount;
      }

      if (isThisWeek(t.date)) {
        weekExpense += t.amount;
      }
    }
  });

  document.getElementById("balance").textContent = balance;
  document.getElementById("today").textContent = todayExpense;
  document.getElementById("week").textContent = weekExpense;

  // 🔥 PREDICTION
  let avgDaily = weekExpense / 7;
  let days = 0;

  if (avgDaily > 0) {
    days = Math.floor(balance / avgDaily);
  }

  // 🔥 SMART MESSAGES
  let message = "👍 You are managing your money";

  if (expense > income) {
    message = "⚠️ You are spending more than you earn!";
  }

  if (todayExpense > 2000) {
    message = "⚠️ You spent a lot today!";
  }

  if (weekExpense > 10000) {
    message = "⚠️ This week spending is high!";
  }

  if (balance < 5000) {
    message = "⚠️ Your balance is getting low";
  }

  if (balance < 0) {
    message = "🚨 You are in debt!";
  }

  if (balance > 0 && avgDaily > 0) {
    message = "💡 At this rate, your money may last " + days + " days";
  }

  document.getElementById("message").textContent = message;

  saveData();
}

function addTransaction() {
  let amount = document.getElementById("amount").value;
  let type = document.getElementById("type").value;
  let category = document.getElementById("category").value;

  if (!amount) {
    alert("Enter amount");
    return;
  }

  transactions.push({
    amount: parseInt(amount),
    type: type,
    category: category,
    date: new Date().toISOString()
  });

  document.getElementById("amount").value = "";

  updateUI();
}

// INITIAL LOAD
updateUI();
</script>

</body>
</html>
